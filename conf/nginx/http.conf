worker_processes auto;                     # MODIFIED

events {
  worker_connections 4096;                 # MODIFIED
  multi_accept on;                         # MODIFIED
}

http {

  # ===== Rate limiting zones =====
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;   # MODIFIED
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;       # MODIFIED
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;          # MODIFIED

  # Configuration containing list of application servers
  upstream app_servers {
    server ctfd:8000;
    keepalive 32;                          # MODIFIED
  }

  server {

    listen 80;

    gzip on;

    client_max_body_size 50M;              # MODIFIED

    limit_conn conn_limit 50;              # MODIFIED: max concurrent connections per IP

    # Handle Server Sent Events for Notifications
    location /events {

      limit_req off;                       # MODIFIED: NEVER rate-limit SSE
      limit_conn off;                      # MODIFIED

      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_read_timeout 1h;               # MODIFIED

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    # Auth endpoints (stricter)
    location ~ ^/(login|register|reset_password) {   # MODIFIED

      limit_req zone=auth burst=10 nodelay;          # MODIFIED

      proxy_pass http://app_servers;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    # Proxy connections to the application servers
    location / {

      limit_req zone=general burst=50 nodelay;       # MODIFIED

      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_http_version 1.1;                        # MODIFIED
      proxy_set_header Connection "";                # MODIFIED

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }
  }
}