<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .star { fill: rgba(0, 240, 255, 0.4); }
      .line { stroke: rgba(0, 240, 255, 0.2); stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Constellation 1 -->
  <circle cx="50" cy="50" r="2" class="star" />
  <circle cx="120" cy="80" r="2" class="star" />
  <circle cx="90" cy="150" r="2" class="star" />
  <line x1="50" y1="50" x2="120" y2="80" class="line" />
  <line x1="120" y1="80" x2="90" y2="150" class="line" />
  
  <!-- Constellation 2 -->
  <circle cx="250" cy="250" r="2" class="star" />
  <circle cx="320" cy="220" r="2" class="star" />
  <circle cx="350" cy="280" r="2" class="star" />
  <circle cx="300" cy="350" r="2" class="star" />
  <line x1="250" y1="250" x2="320" y2="220" class="line" />
  <line x1="320" y1="220" x2="350" y2="280" class="line" />
  <line x1="350" y1="280" x2="300" y2="350" class="line" />
  
  <!-- Random stray stars -->
  <circle cx="180" cy="100" r="1.5" class="star" />
  <circle cx="380" cy="50" r="1.5" class="star" />
  <circle cx="20" cy="380" r="1.5" class="star" />
</svg>
